name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch full history and all tags so build.cmd can run `git describe`
          fetch-depth: 0
          fetch-tags: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install dependencies
        run: vcpkg install --triplet x86-windows

      - name: Build using build.cmd
        run: ./build.cmd

      - name: Install Coverage Tools
        run: choco install opencppcoverage -y

      - name: Run Tests with Coverage
        shell: cmd
        run: |
          "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" ^
            --export_type=cobertura:coverage.xml ^
            --excluded_sources=vcpkg ^
            --excluded_sources=vcpkg_installed ^
            --excluded_sources="Program Files" ^
            --excluded_sources="Program Files (x86)" ^
            -- ^
            ColorCopTests\Release\ColorCopTests.exe ^
            --reporter console

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          $url = "https://aka.ms/vc14/vc_redist.x86.exe"
          $out = "ColorCop/installer/vc_redist.x86.exe"

          Invoke-WebRequest -Uri $url -OutFile $out

          $sig = Get-AuthenticodeSignature $out

          if ($sig.Status -ne 'Valid') {
            throw "Invalid code signature on vc_redist.x86.exe"
          }

          Write-Host "Signature verified:"
          Write-Host $sig.SignerCertificate.Subject

      - name: Build Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: ColorCop\installer\colorcop.iss
          options: /O+

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: installers
          path: .\ColorCop\output
          retention-days: 30

      - name: Create Flat Zip Archive
        run: |
          Remove-Item -Path "Release-standalone" -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path "Release-standalone"

          Copy-Item -Path "ColorCop\Release\*.exe" -Destination "Release-standalone"
          Copy-Item -Path "ColorCop\ReadMe.txt" -Destination "Release-standalone"
          Copy-Item -Path "LICENSE.txt" -Destination "Release-standalone"
          Copy-Item -Path "ColorCop\packaging\*.chm" -Destination "Release-standalone"

          Set-Location "Release-standalone"

          Compress-Archive -Path "*" -DestinationPath "../colorcop.zip" -Force

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v7
        with:
          name: colorcop-zip
          path: colorcop.zip
          retention-days: 30

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          body: |
            ## ColorCop Release

            This release was generated automatically from tag `${{ github.ref_name }}`.
            The changelog and commit summary appear below.

          generate_release_notes: true
          files: |
            colorcop.zip
            ColorCop/output/colorcop-setup.exe
