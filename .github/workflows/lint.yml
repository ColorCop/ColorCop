name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install mise
      uses: jdx/mise-action@v5

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Run linters
      run: just lint
